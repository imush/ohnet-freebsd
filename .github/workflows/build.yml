name: build

# Builds a drop-in zip for every line of VERSIONS. A tag vZIP_VERSION, e.g.
# v1.37.5521.2, publishes that zip as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The oldest FreeBSD 13 image available: libraries built on an older
      # release load on newer ones, not the other way round.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "13.2"
          usesh: true
          run: |
            grep -v '^#' VERSIONS | while read zip ohnet; do
              [ -n "$ohnet" ] && sh scripts/build-native.sh "$ohnet" "build/$ohnet"
            done
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: build/

  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: |
          grep -v '^#' VERSIONS | while read zip ohnet; do
            [ -n "$ohnet" ] && sh scripts/build-jar.sh "$ohnet" "build/$ohnet"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/

  package:
    needs: [native, jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: build/
          merge-multiple: true
      - run: |
          grep -v '^#' VERSIONS | while read zip ohnet; do
            [ -n "$ohnet" ] && sh scripts/package.sh "$zip" "build/$ohnet" dist
          done
      - uses: actions/upload-artifact@v4
        with:
          name: drop-in
          path: dist/
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --title "ohNet for MinimServer $v (FreeBSD amd64)" \
            --notes "Drop-in ohNet for MinimServer on FreeBSD. See the README for how to install it." \
            "dist/ohnet(linux-intel)-$v.zip" "dist/ohnet(linux-intel)-$v.zip.sha256"
