name: build

# Builds a drop-in zip for every line of VERSIONS. A tag vZIP_VERSION, e.g.
# v1.37.5521.2, publishes that zip as a release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The oldest FreeBSD 13 image available: libraries built on an older
      # release load on newer ones, not the other way round.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "13.2"
          usesh: true
          run: |
            grep -v '^#' VERSIONS | while read zip ohnet; do
              [ -n "$ohnet" ] && sh scripts/build-native.sh "$ohnet" "build/$ohnet"
            done
      - uses: actions/upload-artifact@v7
        with:
          name: native
          path: build/

  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - run: |
          grep -v '^#' VERSIONS | while read zip ohnet; do
            [ -n "$ohnet" ] && sh scripts/build-jar.sh "$ohnet" "build/$ohnet"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/

  package:
    needs: [native, jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: build/
          merge-multiple: true
      - run: |
          grep -v '^#' VERSIONS | while read zip ohnet; do
            [ -n "$ohnet" ] && sh scripts/package.sh "$zip" "build/$ohnet" dist
          done
      - uses: actions/upload-artifact@v7
        with:
          name: drop-in
          path: dist/

  # The zips are built on 13.2 and tested there by hand; check that they
  # also load and work on the releases that still have Java packages.
  test:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "14", java: openjdk8-jre }
          - { release: "15", java: openjdk8-jre }
          - { release: "15", java: openjdk21 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: drop-in
          path: dist/
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: pkg install -y ${{ matrix.java }}
          run: |
            java=$(ls /usr/local/openjdk*/bin/java | head -1)
            for z in dist/*.zip; do sh scripts/selftest.sh "$z" "$java"; done

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: drop-in
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" --title "ohNet for MinimServer $v (FreeBSD amd64)" \
            --notes "Drop-in ohNet for MinimServer on FreeBSD. See the README for how to install it." \
            "dist/ohnet(linux-intel)-$v.zip" "dist/ohnet(linux-intel)-$v.zip.sha256"
